<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="t">
<title id="t">Foto de cliente sonriendo con el celular — reemplazar por fotografía real</title>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0f5c2e"/>
<stop offset="0.6" stop-color="#1ea854"/>
<stop offset="1" stop-color="#e6f5eb"/>
</linearGradient>
</defs>
<rect width="640" height="800" fill="url(#g)"/>
<circle cx="320" cy="330" r="110" fill="rgba(255,255,255,0.18)"/>
<g transform="translate(270,280)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
<rect x="10" y="0" width="80" height="140" rx="14"/>
<line x1="35" y1="120" x2="65" y2="120"/>
</g>
<text x="320" y="560" text-anchor="middle" font-family="Poppins, sans-serif" font-size="22" fill="#ffffff" opacity="0.85">Foto real del cliente</text>
<text x="320" y="592" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#ffffff" opacity="0.7">(reemplazar en producción)</text>
</svg>
